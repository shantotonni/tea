<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1920 1080' width='100%' height='100%' preserveAspectRatio='xMidYMid slice'>
  <defs>
    <!-- Sky & Dawn Sunburst Gradient -->
    <linearGradient id='skyGrad' x1='50%' y1='0%' x2='50%' y2='100%'>
      <stop offset='0%' stop-color='#06120d'/>
      <stop offset='35%' stop-color='#102b1e'/>
      <stop offset='65%' stop-color='#234f37'/>
      <stop offset='100%' stop-color='#0a1c13'/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id='sunGlow' cx='75%' cy='22%' r='55%'>
      <stop offset='0%' stop-color='#ffeab3' stop-opacity='0.6'/>
      <stop offset='25%' stop-color='#c8a24a' stop-opacity='0.4'/>
      <stop offset='60%' stop-color='#3f8a5c' stop-opacity='0.15'/>
      <stop offset='100%' stop-color='#06120d' stop-opacity='0'/>
    </radialGradient>

    <!-- Mist Overlay Gradient -->
    <linearGradient id='mistGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#ffffff' stop-opacity='0.22'/>
      <stop offset='50%' stop-color='#c8a24a' stop-opacity='0.1'/>
      <stop offset='100%' stop-color='#06120d' stop-opacity='0'/>
    </linearGradient>

    <!-- Distant Mountain Ridges -->
    <linearGradient id='hill1' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#1a3d2b'/>
      <stop offset='100%' stop-color='#0f261b'/>
    </linearGradient>

    <!-- Midground Tea Slopes -->
    <linearGradient id='hill2' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#26543b'/>
      <stop offset='100%' stop-color='#122b1d'/>
    </linearGradient>

    <!-- Foreground Terraced Tea Plantation Hills -->
    <linearGradient id='hill3' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#34704f'/>
      <stop offset='50%' stop-color='#234f37'/>
      <stop offset='100%' stop-color='#0a1c12'/>
    </linearGradient>

    <!-- Golden Highlight Gradient for Tea Rows -->
    <linearGradient id='goldHighlight' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#c8a24a' stop-opacity='0.4'/>
      <stop offset='50%' stop-color='#edd382' stop-opacity='0.85'/>
      <stop offset='100%' stop-color='#c8a24a' stop-opacity='0.3'/>
    </linearGradient>

    <filter id='blurGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='30'/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width='1920' height='1080' fill='url(#skyGrad)'/>

  <!-- Sun Rays & Glow -->
  <circle cx='1400' cy='240' r='650' fill='url(#sunGlow)'/>
  
  <!-- Distant Mountain Ridges -->
  <path d='M-100,500 Q350,360 800,460 T1700,390 Q1950,420 2050,470 L2050,1180 L-100,1180 Z' fill='url(#hill1)' opacity='0.95'/>
  
  <!-- Mist Valley 1 -->
  <ellipse cx='960' cy='500' rx='1100' ry='140' fill='url(#mistGrad)' filter='url(#blurGlow)'/>

  <!-- Midground Tea Slopes -->
  <path d='M-100,620 Q250,520 680,600 T1450,540 Q1800,590 2050,610 L2050,1180 L-100,1180 Z' fill='url(#hill2)'/>

  <!-- Mist Valley 2 -->
  <ellipse cx='1200' cy='610' rx='900' ry='120' fill='url(#mistGrad)' filter='url(#blurGlow)'/>

  <!-- Foreground Terraced Tea Plantation Hills -->
  <path d='M-100,760 Q400,640 920,750 T1850,690 Q1980,710 2050,740 L2050,1180 L-100,1180 Z' fill='url(#hill3)'/>

  <!-- Curved Terraced Tea Lines -->
  <path d='M-50,770 Q400,660 920,760 T1850,700' stroke='url(#goldHighlight)' stroke-width='5' fill='none' opacity='0.85'/>
  <path d='M-50,810 Q400,700 920,800 T1850,740' stroke='url(#goldHighlight)' stroke-width='6' fill='none' opacity='0.9'/>
  <path d='M-50,850 Q400,740 920,840 T1850,780' stroke='#3f8a5c' stroke-width='7' fill='none' opacity='0.95'/>
  <path d='M-50,890 Q400,780 920,880 T1850,820' stroke='url(#goldHighlight)' stroke-width='7' fill='none' opacity='0.85'/>
  <path d='M-50,930 Q400,820 920,920 T1850,860' stroke='#3f8a5c' stroke-width='8' fill='none' opacity='0.9'/>
  <path d='M-50,970 Q400,860 920,960 T1850,900' stroke='url(#goldHighlight)' stroke-width='8' fill='none' opacity='0.95'/>

  <!-- Ambient Light Dew Particles -->
  <g opacity='0.65'>
    <circle cx='1200' cy='300' r='4' fill='#ffeab3'/>
    <circle cx='1380' cy='270' r='5' fill='#ffffff'/>
    <circle cx='1100' cy='390' r='3.5' fill='#ffeab3'/>
    <circle cx='1450' cy='360' r='6' fill='#f5e6b3'/>
    <circle cx='980' cy='460' r='4' fill='#ffffff'/>
    <circle cx='1300' cy='430' r='4.5' fill='#ffeab3'/>
    <circle cx='1520' cy='250' r='6' fill='#ffffff'/>
    <circle cx='1650' cy='330' r='3.5' fill='#ffeab3'/>
  </g>
</svg>